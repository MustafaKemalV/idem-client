name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, not by tag: a tag can be moved, and a moved tag runs code nobody reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      # The release path must not run for the first time during a release. This covers the source and
      # javadoc jars and the packaging; signing needs a key that does not belong in CI, and the portal
      # plugin binds to deploy, so neither of those is exercised here.
      - name: Release path dry run
        run: mvn -B -ntp -Prelease -DskipTests -Dgpg.skip=true package
